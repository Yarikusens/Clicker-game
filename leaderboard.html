<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="css/leaderboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <article>
            <table>
                <thead>
                    <tr><th>Rank</th><th>Player</th><th>Population</th></tr>
                <tbody>
                    <tr><td>1</td><td>loading</td><td>0</td></tr>
                    <tr><td>2</td><td>loading</td><td>0</td></tr>
                    <tr><td>3</td><td>loading</td><td>0</td></tr>
                    <tr><td>4</td><td>loading</td><td>0</td></tr>
                    <tr><td>5</td><td>loading</td><td>0</td></tr>
                    <tr><td>6</td><td>loading</td><td>0</td></tr>
                    <tr><td>7</td><td>loading</td><td>0</td></tr>
                    <tr><td>8</td><td>loading</td><td>0</td></tr>
                    <tr><td>9</td><td>loading</td><td>0</td></tr>
                    <tr><td>10</td><td>loading</td><td>0</td></tr>
                </tbody>
            </table>
        </article>
        <form id="dataForm">
            <label for="inputName">Your nickname:</label>
            <input type="text" id="inputName" placeholder="Bob Colonizer" required>
            <button type="submit" id="saveButton">Share</button>
        </form>
        <p>Your population: <span>1,000</span></p>
        <a class="leaderboard-button" href="index.html">
            <img src="images/star-leaderboard.png" alt="" class="undraggable">
        </a>
    </main>
    <script src="java-script/leaderboard.js"></script>
</body>
</html>
